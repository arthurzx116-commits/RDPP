name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          
          Set-ItemProperty -Path $rdpPath -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path $tcpPath -Name 'UserAuthentication' -Value 1
          Set-ItemProperty -Path $tcpPath -Name 'SecurityLayer' -Value 2
          
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          if (Get-Service -Name TermService -ErrorAction SilentlyContinue) {
              Restart-Service -Name TermService -Force
          }

      - name: Create RDP User
        shell: powershell
        run: |
          $Username = "Skyro"
          # Senha forte para o usuário
          $Password = "P@ssw0rd2024!RDP" 
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          
          New-LocalUser -Name $Username -Password $SecurePassword -FullName $Username -Description "Usuario RDP Tailscale"
          Add-LocalGroupMember -Group "Administrators" -Member $Username
          
          Write-Host "Usuário $Username criado com sucesso!"

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "tailscale-setup.msi"
          Start-Process msiexec.exe -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -Wait

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # O comando 'up' SEM a chave vai gerar o link de login no log
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up
          
          # Dá um tempo para você clicar no link e autorizar
          Write-Host "Aguardando autenticação..."
          Start-Sleep -Seconds 60 
          
          # Pega o IP gerado
          $IP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "✅ Tailscale IP: $IP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "Testando conexão na porta 3389 no IP $ip..."
          Test-NetConnection -ComputerName $ip -Port 3389

      - name: Maintain Connection
        shell: powershell
        run: |
          # Loop infinito para a máquina não desligar
          while ($true) { Start-Sleep -Seconds 3600 }
