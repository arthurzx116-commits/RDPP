name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Habilitar o RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Restart-Service TermService -Force

      - name: 2. Criar Usuário e Senha (ADMIN)
        shell: powershell
        run: |
          $User = "Admin"
          $Password = "P@ssw0rd2024!RDP"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          
          New-LocalUser -Name $User -Password $SecurePassword -FullName "Admin" -Description "Usuario Admin RDP"
          Add-LocalGroupMember -Group "Administrators" -Member $User
          
          Write-Host "✅ Usuário $User criado com sucesso!"

      - name: 3. Instalar o Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "tailscale-setup.msi"
          Start-Process msiexec.exe -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -Wait

      - name: 4. Conectar ao Tailscale (Login Manual)
        shell: powershell
        run: |
          $TailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          # Inicia o Tailscale SEM chave. Isso vai gerar um link de login no log.
          Write-Host "⚠️ ATENÇÃO: PROCURE O LINK LOGO ABAIXO E CLIQUE NELE PARA AUTORIZAR A MÁQUINA ⚠️"
          & $TailscalePath up --hostname "github-rdp-pc" --accept-routes
          
          Write-Host "Aguardando você clicar no link de autenticação..."
          
          # Loop para esperar você clicar no link (espera até 5 minutos)
          $ip = $null
          $timeout = 300
          $elapsed = 0
          
          while (-not $ip -and $elapsed -lt $timeout) {
              Start-Sleep -Seconds 5
              $elapsed += 5
              $ip = & $TailscalePath ip -4
              if ($ip) { break }
              Write-Host "Aguardando autorização... ($elapsed segundos)"
          }
          
          if ($ip) {
              Write-Host "=================================================="
              Write-Host "✅ Tailscale Conectado com sucesso!"
              Write-Host "Use este IP para conectar no RDP: $ip"
              Write-Host "Usuário: Admin"
              Write-Host "Senha: P@ssw0rd2024!RDP"
              Write-Host "=================================================="
          } else {
              Write-Error "❌ Tempo esgotado. Você não clicou no link a tempo."
              exit 1
          }

      - name: 5. Manter a Máquina Ligada
        shell: powershell
        run: |
          while ($true) { Start-Sleep -Seconds 3600 }
